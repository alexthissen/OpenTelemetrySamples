receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # logging:
  #   verbosity: detailed

  azuremonitor:
    connection_string: add-here
    spaneventsenabled: true
    maxbatchsize: 100
    maxbatchinterval: 10s
  
  otlp/aspire-dashboard:
    endpoint: host.docker.internal:18889
    tls:
      insecure: true

processors:
  batch:

service:
  telemetry:
    logs:
      level: "debug"
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [datadog, azuremonitor, otlp/aspire-dashboard]
      processors: [batch]
    metrics:
      receivers: [otlp]
      exporters: [datadog, azuremonitor, otlp/aspire-dashboard]
      processors: [batch]
    logs:
      receivers: [otlp]
      exporters: [datadog, azuremonitor, otlp/aspire-dashboard]
      processors: [batch]